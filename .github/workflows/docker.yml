name: Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos de Docker Hub
        id: dockerhub
        env:
          USUARIO: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USUARIO" ] && [ -n "$TOKEN" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Faltan DOCKERHUB_USERNAME o DOCKERHUB_TOKEN; se omite la publicación de la imagen."
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.dockerhub.outputs.disponible == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.dockerhub.outputs.disponible == 'true'

      - uses: docker/login-action@v3
        if: steps.dockerhub.outputs.disponible == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        if: steps.dockerhub.outputs.disponible == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/informe-fondos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        if: steps.dockerhub.outputs.disponible == 'true'
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
