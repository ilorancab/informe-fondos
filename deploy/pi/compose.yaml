services:
  informe-fondos:
    image: ${IMAGE:-ilbravo/informe-fondos:latest}
    container_name: informe-fondos
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PUERTO:-8000}:8000"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      INFORME_FONDOS_HOME: /app
      BENCHMARK: ${BENCHMARK:-IWDA.AS}
      APORTACION_PERIODICA: ${APORTACION_PERIODICA:-200}
      FRECUENCIA_APORTACION: ${FRECUENCIA_APORTACION:-mensual}
      INFLACION: ${INFLACION:-espana}
      TEMA: ${TEMA:-auto}
      TASA_LIBRE_RIESGO: ${TASA_LIBRE_RIESGO:-2}
      # Protección opcional con HTTP Basic. Si están vacíos, no hay login.
      WEB_USUARIO: ${WEB_USUARIO:-}
      WEB_CLAVE: ${WEB_CLAVE:-}
    volumes:
      - ./datos:/app/datos
      - ./salida:/app/salida
    restart: unless-stopped
