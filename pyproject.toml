[project]
name = "informe-fondos"
version = "0.2.1"
description = "Genera informes HTML de fondos indexados y ETFs a partir de datos públicos de Yahoo Finance y del INE"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "ilbravo"}]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.24",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
informe-fondos = "informe_fondos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/informe_fondos"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
